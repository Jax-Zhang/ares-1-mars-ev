<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body><title>ARES-1 火星装甲电动车</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: engineering program console. Gate stepper on top, live 3D stage left, gate dossier right. */
:root{
  --bg:#e8ecef; --surface:#f6f8f9; --raised:#ffffff; --ink:#17202a; --muted:#5a6672; --line:#cbd3da;
  --accent:#c45516; --accent-soft:#c4551622; --cyan:#17799f; --ok:#2c8549; --warn:#a87410; --bad:#b33d2b; --robot:#c45516; --man:#2f6fb0; --mach:#6b7480;
  --f-display:"Barlow Condensed","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151a; --surface:#181e25; --raised:#1f262e; --ink:#e2e7eb; --muted:#93a0ab; --line:#2b343e;
  --accent:#ee8743; --accent-soft:#ee874326; --cyan:#4db3da; --ok:#5bbf7a; --warn:#e2a93c; --bad:#e8705a; --robot:#ee8743; --man:#6aa7e8; --mach:#9aa4ae; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11151a; --surface:#181e25; --raised:#1f262e; --ink:#e2e7eb; --muted:#93a0ab; --line:#2b343e;
  --accent:#ee8743; --accent-soft:#ee874326; --cyan:#4db3da; --ok:#5bbf7a; --warn:#e2a93c; --bad:#e8705a; --robot:#ee8743; --man:#6aa7e8; --mach:#9aa4ae; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

header{border-bottom:1px solid var(--line);background:var(--surface);
  padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.04em;margin:0;line-height:1}
.brand h1 b{color:var(--accent);font-weight:700}
.brand p{margin:0;color:var(--muted);font-size:13px}
.brand .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.brand .tag{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.upbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);color:var(--accent);background:var(--raised);border-radius:3px;padding:4px 10px;font-size:13px;cursor:pointer}
.upbtn:hover{background:var(--accent-soft)}
.upbtn.xpbtn{background:var(--accent);color:#fff;font-weight:500}
.upbtn.xpbtn:hover{background:var(--accent);filter:brightness(1.1)}
nav.gates{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav.gates::-webkit-scrollbar{display:none}
.gate{flex:1 0 auto;min-width:104px;background:none;border:0;border-bottom:3px solid transparent;padding:6px 10px 8px;text-align:left;cursor:pointer;color:var(--muted)}
.gate .code{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em}
.gate .nm{display:block;font-weight:500;font-size:14px;white-space:nowrap}
.gate:hover{color:var(--ink)}
.gate[aria-current="step"]{color:var(--ink);border-bottom-color:var(--accent)}
.gate[aria-current="step"] .code{color:var(--accent)}
.gate.done .code::after{content:" ✓";color:var(--ok)}
.gate.cond .code::after{content:" !";color:var(--warn);font-weight:700}
.lnk{font-family:var(--f-mono);font-size:11px;line-height:1.5;border:1px solid var(--line);background:var(--raised);border-radius:3px;padding:0 6px;cursor:pointer;color:var(--cyan);white-space:nowrap}
.lnk:hover{border-color:var(--cyan)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:340px}
.tbl th,.tbl td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.tbl td small{display:block;color:var(--muted);font-size:12px}
.tbl .pill{font-size:11px}
.vitem.req>button{grid-template-columns:66px minmax(0,1fr) auto}
.vitem.req .vbody{padding-left:86px}
.tline{list-style:none;margin:0;padding:0}
.tline li{display:grid;grid-template-columns:12px 40px 62px minmax(0,1fr);gap:8px;align-items:baseline;font-size:13px;padding:5px 0;position:relative}
.tline li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok);align-self:center}
.tline li.run::before{background:var(--warn)}
.tline li:not(:last-child)::after{content:"";position:absolute;left:4px;top:60%;height:80%;width:1px;background:var(--line)}
.tline p{margin:0;max-width:none}
.tline span{color:var(--muted);font-size:12px}

main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);min-height:0}
.stage{position:relative;min-height:0;border-right:1px solid var(--line);overflow:hidden;
  background:radial-gradient(120% 90% at 50% 100%,var(--accent-soft),transparent 60%),var(--bg)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:14px;top:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none;max-width:calc(100% - 28px)}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;padding:3px 8px;border:1px solid var(--line);background:var(--surface);border-radius:3px;color:var(--muted)}
.chip.on{color:var(--accent);border-color:var(--accent)}
.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);pointer-events:none;max-width:calc(100% - 28px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.stagebar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:color-mix(in srgb,var(--surface) 86%,transparent);box-shadow:0 6px 18px #0002;max-width:calc(100% - 28px);flex-wrap:wrap;justify-content:center}
.stagebar span{font-size:12px;color:var(--muted);margin:0 2px 0 4px}
.stagebar i{width:1px;height:18px;background:var(--line);margin:0 4px}
.tip{position:absolute;pointer-events:none;background:var(--raised);border:1px solid var(--line);padding:6px 9px;font-size:12px;border-radius:4px;box-shadow:0 4px 14px #0002;max-width:240px}
.tip b{display:block;font-size:13px}
.note3d{position:absolute;right:14px;bottom:12px;font-size:11px;color:var(--muted);max-width:46%;text-align:right;pointer-events:none}
.readout{position:absolute;right:14px;top:46px;min-width:210px;max-width:min(300px,calc(100% - 28px));background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px;pointer-events:none;box-shadow:0 6px 18px #0001}
.readout .rt{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;color:var(--accent);margin-bottom:4px}
.readout .rt span:last-child{color:var(--muted)}
.readout .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:2px 0;border-top:1px dashed var(--line)}
.readout .row:first-of-type{border-top:0}
.readout .row span{font-size:12px;color:var(--muted)}
.readout .row b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.readout .row b.ok{color:var(--ok)} .readout .row b.warn{color:var(--warn)} .readout .row b.bad{color:var(--bad)}
.readout .row b small{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;white-space:nowrap;font-size:11px;line-height:1.3;
  background:color-mix(in srgb,var(--surface) 46%,transparent);border:1px solid color-mix(in srgb,var(--line) 45%,transparent);border-left:2px solid var(--accent);border-radius:2px;padding:2px 6px;color:var(--ink);transition:opacity .2s,background .15s;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);text-shadow:0 0 3px var(--surface),0 0 3px var(--surface)}
.lbl:hover{background:color-mix(in srgb,var(--surface) 92%,transparent);border-color:var(--line);z-index:2}
.lbl small{display:block;font-family:var(--f-mono);font-size:9.5px;color:var(--muted)}
.lbl.sel{border-color:var(--accent);background:color-mix(in srgb,var(--surface) 80%,var(--accent) 20%);z-index:1}

.panel{min-height:0;overflow-y:auto;background:var(--surface);
  padding-block:18px 28px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.15;margin:2px 0 6px;letter-spacing:.01em;text-wrap:balance}
.panel h3{font-size:13px;font-weight:700;margin:22px 0 8px;letter-spacing:.06em;color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.1em}
.lede{color:var(--muted);margin:0 0 10px;max-width:62ch}
.panel p{max-width:62ch}
table.spec{width:100%;border-collapse:collapse;font-size:13px}
table.spec td,table.spec th{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
table.spec th{font-size:12px;color:var(--muted);font-weight:500}
table.spec td:first-child{color:var(--muted);width:34%;padding-right:10px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-mono);font-size:12px;width:24px;height:24px;border:1px solid var(--accent);color:var(--accent);border-radius:50%;display:grid;place-items:center}
.steps b{display:block}
.steps span{color:var(--muted);font-size:13px}
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.gallery button{padding:0;border:1px solid var(--line);background:var(--raised);cursor:pointer;border-radius:3px;overflow:hidden}
.gallery button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gallery img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.gallery small{display:block;font-size:11px;padding:2px 0;color:var(--muted)}
.hero-img{width:100%;border:1px solid var(--line);border-radius:3px;display:block;background:var(--raised);margin-bottom:6px}
.pipe{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.pipe span{border:1px solid var(--line);background:var(--raised);padding:4px 8px;border-radius:3px}
.pipe em{font-style:normal;color:var(--accent)}
.vstat{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin-bottom:10px}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;font-weight:500}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.vlist{display:grid;gap:6px;margin-top:12px}
.vitem{border:1px solid var(--line);background:var(--raised);border-radius:4px}
.vitem>button{width:100%;background:none;border:0;padding:9px 12px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;cursor:pointer}
.vitem .vid{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.vitem .vn{font-weight:500}
.vitem .vn small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.vitem .vbody{padding:0 12px 12px 54px;font-size:13px}
.vitem .vbody dl{margin:0;display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 10px}
.vitem .vbody dt{color:var(--muted)}
.vitem .vbody dd{margin:0}
.vitem[data-open="true"]{border-color:var(--accent)}
.callout{border-left:3px solid var(--cyan);background:var(--raised);padding:10px 12px;font-size:13px;border-radius:0 4px 4px 0;margin-top:12px}
.callout b{color:var(--cyan)}
.disclaim{font-size:12px;color:var(--muted)}
.bench{border:1px solid var(--accent);border-radius:4px;background:var(--raised);padding:12px;display:grid;gap:8px}
.bench .bh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bench .bh b{font-size:15px}
.bench .phase{font-size:12px;color:var(--muted);min-height:1.6em}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);width:0}
.vchart svg{display:block;width:100%;height:auto}
.vchart text{font-family:var(--f-mono);font-size:9px;fill:var(--muted)}
.vchart .grid{stroke:var(--line)}
.vchart .lim{stroke:var(--bad);stroke-dasharray:4 3}
.ctrl{display:grid;gap:8px;background:var(--raised);border:1px solid var(--line);padding:12px;border-radius:4px}
.ctrl label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--accent)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-4px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--raised);padding:5px 12px;border-radius:3px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.plist{display:grid;gap:2px}
.plist button{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:8px;align-items:center;background:none;border:0;border-radius:3px;padding:5px 6px;text-align:left;cursor:pointer;font-size:13px}
.plist button:hover,.plist button[aria-pressed="true"]{background:var(--accent-soft)}
.plist i{width:10px;height:10px;border-radius:2px}
.plist .m{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:56px;text-align:right}
.plist small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.lnk[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.pcard{border:1px solid var(--accent);border-radius:4px;padding:12px;background:var(--raised)}
.pcard h4{margin:0 0 4px;font-size:16px}
.pcard .meta{font-size:12px;color:var(--muted)}
.pcard ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.massbar{display:flex;height:16px;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.massbar span{display:block;height:100%}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{border:1px solid var(--line);background:var(--raised);padding:8px 10px;border-radius:4px}
.kpi b{display:block;font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.1}
.kpi span{font-size:11px;color:var(--muted)}
.svgwrap{overflow-x:auto;border:1px solid var(--line);background:var(--raised);border-radius:4px}
.svgwrap svg{display:block;width:100%;min-width:320px;height:auto}
svg text{font-family:var(--f-body)}
.stn{cursor:pointer}
.stn rect{fill:var(--surface);stroke:var(--line)}
.stn.feeder rect{stroke-dasharray:3 2}
.stn:hover rect,.stn.sel rect{stroke:var(--accent);stroke-width:1.6}
.stn.sel rect{fill:var(--accent-soft)}
.stn text{fill:var(--ink);font-size:9px}
.stn .sid{font-family:var(--f-mono);font-size:8px;fill:var(--muted)}
.flow{stroke:var(--muted);stroke-width:1.2;fill:none}
.chart text{fill:var(--muted);font-size:9px;font-family:var(--f-mono)}
.chart .bar{fill:var(--cyan);opacity:.85}
.chart .bar.sel{fill:var(--accent);opacity:1}
.chart .takt{stroke:var(--bad);stroke-dasharray:4 3}
.chart .grid{stroke:var(--line)}
/* digital-twin line */
.strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.strip button{border:1px solid var(--line);background:var(--raised);border-radius:3px;padding:4px 0 3px;cursor:pointer;font-family:var(--f-mono);font-size:10px;position:relative;overflow:hidden}
.strip button span{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0}
.strip button.cur{border-color:var(--accent);color:var(--accent)}
.strip button.done{color:var(--muted)}
.strip button.done::after{content:" ✓";color:var(--ok)}
.flow{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:min(520px,calc(100% - 28px));background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px;padding:8px 14px;font-size:13px;box-shadow:0 6px 18px #0002;pointer-events:none}
.flow b{font-family:var(--f-mono)}
.flow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.flow .bar{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.flow .bar span{display:block;height:100%;background:var(--accent)}
.flow.done{border-left-color:var(--ok)}
.clock{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.clock b{font-family:var(--f-mono);color:var(--ink);font-size:13px}
.gantt{display:grid;gap:5px}
.grow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:center;font-size:12px}
.who{font-size:10.5px;border-radius:2px;padding:1px 0;text-align:center;color:#fff;font-weight:500}
.who.robot{background:var(--robot)} .who.man{background:var(--man)} .who.mach{background:var(--mach)}
.gbar{position:relative;height:22px;background:var(--bg);border-radius:2px;overflow:hidden}
.gbar .seg{position:absolute;top:0;bottom:0;border-radius:2px;opacity:.25}
.gbar .seg.robot{background:var(--robot)} .gbar .seg.man{background:var(--man)} .gbar .seg.mach{background:var(--mach)}
.gbar .seg.on{opacity:.9}
.gbar .nm{position:absolute;left:6px;top:2px;font-size:11.5px;white-space:nowrap;color:var(--ink)}
.gbar .cur{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.supply{width:100%;border-collapse:collapse;font-size:12.5px}
.supply td,.supply th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.supply th{color:var(--muted);font-weight:500;font-size:12px}
.bins{display:inline-flex;gap:2px;vertical-align:middle}
.bins i{width:7px;height:10px;border-radius:1px;background:var(--line)}
.bins i.f{background:var(--cyan)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;font-size:13px;align-items:start}
.checks li::before{content:"✓";color:var(--ok);font-weight:700}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tool{border:1px solid var(--line);background:var(--raised);border-radius:4px;padding:8px 10px;font-size:12px}
.tool b{display:block;font-size:13px}
.tool span{color:var(--muted)}
.foot{margin-top:24px;font-size:12px;color:var(--muted)}
/* upload dialog */
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:6px;max-width:520px;width:100%;padding:18px;display:grid;gap:12px;box-shadow:0 20px 50px #0004}
.dlg h2{font-family:var(--f-display);font-size:24px;margin:0}
.dlg .field{display:grid;gap:4px;font-size:13px}
.dlg .field span{color:var(--muted);font-size:12px}
.dlg input[type=text]{border:1px solid var(--line);background:var(--raised);border-radius:3px;padding:6px 8px}
.dlg input[type=file]{font-size:12px}
.dlg .msg{font-size:12px;color:var(--muted);min-height:1.4em}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}

</div>

function chamferBox(w,h,d,c=.04){ const s = new THREE.Shape(), x = w/2, y = h/2; c = Math.min(c, x*.45, y*.45);
  s.moveTo(-x+c,-y); s.lineTo(x-c,-y); s.lineTo(x,-y+c); s.lineTo(x,y-c); s.lineTo(x-c,y); s.lineTo(-x+c,y); s.lineTo(-x,y-c); s.lineTo(-x,-y+c); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth:d, bevelEnabled:false }); g.translate(0,0,-d/2); return g; }
const cylY = (r,l,n=24) => new THREE.CylinderGeometry(r,r,l,n);
const cylZ = (r,l,n=24) => new THREE.CylinderGeometry(r,r,l,n).rotateX(Math.PI/2);

function gearGeo(r, teeth, th){ const s = new THREE.Shape(), N = teeth*4;
  for (let i=0;i<=N;i++){ const a = i/N*Math.PI*2, rr = (i%4 < 2) ? r : r*.86; i ? s.lineTo(Math.cos(a)*rr, Math.sin(a)*rr) : s.moveTo(Math.cos(a)*rr, Math.sin(a)*rr); }
  const hole = new THREE.Path(); hole.absarc(0,0,r*.24,0,Math.PI*2,true); s.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(s, { depth:th, bevelEnabled:false }); g.translate(0,0,-th/2); return g; }
function springGeo(R, len, turns, wire){ const pts = []; const n = turns*20;
  for (let i=0;i<=n;i++){ const a = i/20*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*R, -len/2 + len*i/n, Math.sin(a)*R)); }
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), n, wire, 6, false); }
function M(g, m, x=0, y=0, z=0, sub){ const o = new THREE.Mesh(g, m); o.position.set(x,y,z); if (sub) o.userData.sub = new THREE.Vector3(...sub); return o; }

  const mf = await fetch(A+'model/manifest.json').catch(() => null);

        const raw = await readBody(r, tick); const u = new Uint8Array(raw.reduce((a,c)=>a+c.length,0)); let o = 0; raw.forEach(c => { u.set(c,o); o += c.length; });

// Find wheels in a single-mesh vehicle: lower, outboard vertices clustered along the length axis.
function detectWheels(geo){
  const pos = geo.attributes.position.array, n = pos.length/3;

  for (let i=0;i<n;i+=5) for (let a=0;a<3;a++){ const v = pos[i*3+a]; if (v<mn[a]) mn[a]=v; if (v>mx[a]) mx[a]=v; }

  const NB = 200, bins = new Uint32Array(NB);
  for (let i=0;i<n;i+=2){ if (pos[i*3+1] > yCut) continue; if (Math.abs(pos[i*3+W]-wc) < outer) continue; bins[Math.min(NB-1, ((pos[i*3+L]-mn[L])/ext[L]*NB)|0)]++; }
  let mxb = 0; for (const b of bins) mxb = Math.max(mxb, b); const thr = mxb*.08, clusters = []; let s = -1;
  for (let b=0;b<=NB;b++){ const on = b < NB && bins[b] > thr; if (on && s < 0) s = b; if (!on && s >= 0){ if (b-s >= 3) clusters.push([s,b-1]); s = -1; } }
  const wheels = [];
  for (const [b0,b1] of clusters) for (const side of [1,-1]) {
    const l0 = mn[L] + b0/NB*ext[L] - ext[L]*.004, l1 = mn[L] + (b1+1)/NB*ext[L] + ext[L]*.004;
    let ymin = 1e9, lmn = 1e9, lmx = -1e9, wmn = 1e9, wmx = -1e9, c = 0;
    for (let i=0;i<n;i+=2){ const y = pos[i*3+1]; if (y > yCut) continue; const w = (pos[i*3+W]-wc)*side; if (w < outer) continue; const l = pos[i*3+L]; if (l < l0 || l > l1) continue;
      c++; if (y < ymin) ymin = y; if (l < lmn) lmn = l; if (l > lmx) lmx = l; if (w < wmn) wmn = w; if (w > wmx) wmx = w; }
    if (c < 200) continue; const R = (lmx-lmn)/2; if (R < H*.08 || R > H*.45) continue;
    wheels.push({ side, cl:(lmn+lmx)/2, cy:ymin+R, R, cw:wc + side*(wmn+wmx)/2 });
  }
  return { L, W, wc, outer, wheels };
}
// Partition the original triangle index into body + one mesh per wheel (vertex buffers are shared, nothing is decimated).
function splitWheels(mesh, det){
  const g = mesh.geometry, pos = g.attributes.position.array, idx = g.index.array, nv = pos.length/3, nt = idx.length/3, { L, W, wc, outer } = det;
  // Find each tire's real edges from the vertices themselves: the inner sidewall sits past an empty gap from the
  // suspension, and tread lugs reach a little beyond the measured radius before the fender starts.
  const ws = det.wheels.map(w => {
    const cwOff = (w.cw - wc)*w.side, lo = outer*.6, NBW = 40, bw = (cwOff-lo)/NBW, hw = new Uint32Array(NBW);
    const NBR = 8, br = .025, hr = new Uint32Array(NBR);   // radius bins over 1.0–1.2 R
    for (let v=0; v<nv; v++){ const wv = (pos[3*v+W]-wc)*w.side; if (wv < lo) continue; const dy = pos[3*v+1]-w.cy, dl = pos[3*v+L]-w.cl, r = Math.sqrt(dy*dy+dl*dl)/w.R;
      if (wv < cwOff && r > .8 && r < 1.05) hw[Math.min(NBW-1, ((wv-lo)/bw)|0)]++;
      if (wv > outer && r >= 1 && r < 1.2) hr[Math.min(NBR-1, ((r-1)/br)|0)]++; }

    let mb = 0; for (let b=1; b<5; b++) if (hr[b] < hr[mb]) mb = b;
    const Rc = w.R*(1 + (mb+.5)*br);
    return { ...w, rin, R2:Rc*Rc };
  }), K = ws.length;

  const mk = Lk => { const ng = new THREE.BufferGeometry(); for (const [nm,a] of Object.entries(g.attributes)) ng.setAttribute(nm,a); ng.setIndex(new THREE.BufferAttribute(Lk,1)); return ng; };
  if (!g.boundingSphere) g.computeBoundingSphere();

  return ws.map((w,k) => {
    const wg = mk(lists[k]); const c = new THREE.Vector3(); c.setComponent(W, w.cw); c.setComponent(1, w.cy); c.setComponent(L, w.cl);
    wg.boundingSphere = new THREE.Sphere(c.clone(), w.R*1.4);

    const pivot = new THREE.Group(); pivot.position.copy(c); pivot.add(m);

  });
}

    try { const buf = await glb.arrayBuffer(); clearHi3d(); hi3dState = 'loading'; await loadGlb(buf, { flip, custom:true }); msg.textContent = '已加载新模型。'; }
    catch (err) { msg.textContent = '模型解析失败：请确认是 .glb 文件。'; hi3dState = hi3d ? 'ok' : 'missing'; return; } }
  modal.hidden = true; applyGate();
});

const mq = matchMedia('(prefers-color-scheme: dark)');
const retheme = () => { buildGrid(); refreshColors(); applyGate(true); };
mq.addEventListener?.('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
function resize(){ const w = stageEl.clientWidth, h = stageEl.clientHeight; renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stageEl); resize();

/* ================================================================== loop */
const clock = new THREE.Clock();
let wheelSpin = 0, prevRigX = 0;
function updateWheels(dt){
  if (rig.spinRate != null) wheelSpin += rig.spinRate*dt;
  else { const dx = rig.x - prevRigX; if (Math.abs(dx) < 1 && rig.y < .1) wheelSpin += dx/WHEEL_R; }
  prevRigX = rig.x;
  parts.forEach((p,i) => { if (!p.isWheel) return; p.spin.rotation.z = -wheelSpin; p.spin.position.y = rig.dyFn ? rig.dyFn(p, i) : 0; });
}
const perf = { frames:0, acc:0 };
function adaptResolution(dt){
  perf.frames++; perf.acc += dt; if (perf.acc < 2) return;
  const fps = perf.frames/perf.acc; perf.frames = 0; perf.acc = 0;
  let next = pixelRatio;
  if (fps < 28 && pixelRatio > .6) next = Math.max(.6, pixelRatio - .2);
  else if (fps > 52 && pixelRatio < PR_MAX) next = Math.min(PR_MAX, pixelRatio + .15);
  if (next !== pixelRatio && document.visibilityState === 'visible') { pixelRatio = next; renderer.setPixelRatio(pixelRatio); resize(); }
}
function loop(){
  if (window.__xpActive) { clock.getDelta(); return requestAnimationFrame(loop); }   // experience mode owns the screen: pause the main stage
  const dt = Math.min(clock.getDelta(), .25); const g = gid();
  adaptResolution(dt);
  if (camTarget) { camera.position.lerp(camTarget, 1 - Math.pow(.02, dt)); if (camera.position.distanceTo(camTarget) < .05) camTarget = null; }
  if (focusTarget) { controls.target.lerp(focusTarget, 1 - Math.pow(.02, dt)); if (controls.target.distanceTo(focusTarget) < .02) focusTarget = null; }
  // exploded view (with demo sequence)
  if (st.explodeAnim) { const a = st.explodeAnim; a.t += dt; const T = a.t % 15;
    st.explode = T < 6 ? ease(T/6) : (T < 9 ? 1 : (T < 13 ? 1 - ease((T-9)/4) : 0)); const ev = $('#explode'); if (ev) { ev.value = Math.round(st.explode*100); $('#expv').textContent = ev.value + '%'; } }
  const wantExp = g === 'g3' ? st.explode : (g === 'tr' ? .55 : 0);
  st.explodeShown += (wantExp - st.explodeShown) * (st.explodeAnim ? 1 : (1 - Math.pow(.002, dt)));
  st.lift += ((g === 'g3' || g === 'tr' ? clamp(st.explodeShown/.6,0,1)*1.4 : 0) - st.lift) * (1 - Math.pow(.002, dt));
  let ls = null;
  if (g === 'g5') { applyExplode(0); ls = updateLine(dt); lineUi(ls); }
  else applyExplode(st.explodeShown);
  stepPanels(dt); stepEnvFx(dt); stepGlow(dt);
  if (st.vizOn) { const z = VIZ[st.vizOn];
    if (st.vplay) { st.vt += dt; if (st.vt > z.dur + 2.5) { st.vt = 0; resetRig(); } }
    const u = clamp(st.vt / z.dur, 0, 1);
    z.frame(u, st.vplay && st.vt <= z.dur ? dt : (['V1','V2','V4','E3','E5'].includes(st.vizOn) ? dt*.4 : 0));
    vizUi(); }
  dmu.position.set(rig.x, st.lift + rig.y, rig.z); dmu.rotation.set(rig.rx, rig.ry, rig.rz);
  updateWheels(dt);
  if (g === 'g0') animAstronauts(performance.now()/1000);
  if (g === 'g5' && ls) { const want = new THREE.Vector3(ls.carX, 1.2, 0); const d = want.sub(controls.target).multiplyScalar(1 - Math.pow(.05, dt)); controls.target.add(d); camera.position.add(d); }
  updateLabels();
  shadow.position.set(rig.x, .006, rig.z); shadow.material.opacity = (1 - clamp(st.lift/1.4,0,1)*.6) * (1 - clamp(rig.y/5,0,.7));
  controls.update(); renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

const fromHash = () => { const i = GATES.findIndex(g => '#'+g.id === location.hash); if (i >= 0 && i !== st.gate) goGate(i, true); };
window.addEventListener('hashchange', fromHash);
renderGates(); applyGate(); fromHash();
loop();
</script>
